<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rating Card</title>
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index.js" defer></script>
  </head>
  <body>
    <div class="card">
      <header class="card-header">
        <img src="./assets/images/icon-star.svg" alt="A star Icon" />
      </header>
      <main class="card-body">
        <article class="card-body-head">
          <h1>How did we do?</h1>
        </article>
        <article class="card-body-body">
          <p>
            Please let us know how we did with your support request. All
            feedback is appreciated to help us improve our offering!
          </p>
        </article>
        <article class="card-body-footer">
          <button type="button" data-tip="1" class="btn btn-rate">1</button>
          <button type="button" data-tip="2" class="btn btn-rate">2</button>
          <button type="button" data-tip="3" class="btn btn-rate">3</button>
          <button type="button" data-tip="4" class="btn btn-rate">4</button>
          <button type="button" data-tip="5" class="btn btn-rate">5</button>
        </article>
      </main>
      <footer class="card-footer">
        <button class="btn btn-submit" type="submit">SUBMIT</button>
      </footer>
    </div>

    <div class="card hidden">
      <header class="card-header-2">
        <img
          src="./assets/images/illustration-thank-you.svg"
          alt="Thank You Card"
        />
      </header>
      <main class="card-body">
        <p class="rating">You selected <span id="rate">X</span> out of 5</p>
      </main>
      <footer class="card-footer">
        <h2>Thank You</h2>
        <p>
          We appreciate you taking the time to give a rating. If you ever need
          more support, don’t hesitate to get in touch!
        </p>
      </footer>
    </div>
  </body>
</html>
